[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
scroll = "https://rpc.scroll.io"
scroll_sepolia = "${SCROLL_SEPOLIA_RPC_URL}"

[etherscan]
scroll = { key = "${SCROLLSCAN_API_KEY}", url = "https://scrollscan.com" }
scroll_sepolia = { key = "${SCROLLSCAN_API_KEY}", url = "https://sepolia.scrollscan.com" }
